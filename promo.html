<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Промо-картинка вебинара</title>
<!--
  Исходник промо-изображения для WhatsApp и соцсетей.
  Структура и тексты повторяют прежний постер, оформление - в стиле сайта.
  Холст 1080x1800. Пересобрать картинку: открыть файл в браузере и снять
  скриншот окна 1080x1800 либо, при закрытом Chrome, выполнить:
  chrome --headless --screenshot=promo.png --window-size=1080,1800 promo.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101014;
    --ink-soft: #5c5c6b;
    --paper: #ffffff;
    --mist: #f2f2f4;
    --line: #e6e6ec;
    --lime: #e4fa7c;
    --lime-deep: #cfef4e;
    --violet: #4b33e8;
    --coal: #1b1b21;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1800px;
    padding: 92px 80px 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 92px;
    background:
      radial-gradient(110% 55% at 100% 0%, rgba(228, 250, 124, .9) 0%, rgba(228, 250, 124, 0) 60%),
      var(--paper);
    color: var(--ink);
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Заголовок ---------- */
  .title {
    font-size: 88px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -.025em;
    text-align: center;
    text-transform: uppercase;
  }
  .sub {
    margin-top: 34px;
    font-size: 41px;
    font-weight: 600;
    text-align: center;
  }

  /* Лаймовый маркер вместо цветного текста: на белом он читается лучше */
  .mark { position: relative; white-space: nowrap; z-index: 0; }
  .mark::after {
    content: "";
    position: absolute;
    left: -6px;
    right: -6px;
    bottom: .11em;
    height: .32em;
    border-radius: 8px;
    background: var(--lime);
    z-index: -1;
  }
  .mark--thin::after { bottom: .02em; height: .44em; }

  /* ---------- Стоимость ---------- */
  .price {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .price__rule {
    flex: 1;
    height: 3px;
    background: var(--ink);
    opacity: .18;
  }
  .price__badge {
    padding: 24px 46px;
    border-radius: 26px;
    background: var(--coal);
    text-align: center;
  }
  .price__label {
    display: block;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--lime);
  }
  .price__value {
    display: block;
    margin-top: 8px;
    font-size: 52px;
    font-weight: 800;
    letter-spacing: -.02em;
    text-transform: uppercase;
    color: var(--paper);
  }

  /* ---------- Блоки ---------- */
  .block__head {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .block__icon {
    flex: 0 0 auto;
    width: 62px;
    height: 62px;
  }
  .block__title {
    font-size: 43px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .block__text {
    margin-top: 26px;
    font-size: 40px;
    font-weight: 600;
    line-height: 1.4;
  }
  .block__text span { color: var(--ink-soft); }

  /* Нижний блок: текст слева, иллюстрация справа */
  .split {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 92px;
    gap: 40px;
  }
  .split__art { flex: 0 0 auto; width: 380px; }
</style>
</head>
<body>

  <header>
    <h1 class="title">Создай свой<br>сайт за <span class="mark">15 минут</span></h1>
    <p class="sub">Начни легко использовать <span class="mark mark--thin">ИИ</span></p>
  </header>

  <div class="price">
    <span class="price__rule"></span>
    <div class="price__badge">
      <span class="price__label">Стоимость занятия</span>
      <span class="price__value">230 песо</span>
    </div>
    <span class="price__rule"></span>
  </div>

  <div class="block">
    <div class="block__head">
      <!-- Календарь -->
      <svg class="block__icon" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="10" width="54" height="48" rx="12" fill="#e4fa7c" stroke="#101014" stroke-width="4"/>
        <path d="M4 26h54" stroke="#101014" stroke-width="4"/>
        <path d="M19 4v12M43 4v12" stroke="#101014" stroke-width="5" stroke-linecap="round"/>
        <circle cx="20" cy="38" r="3.6" fill="#101014"/>
        <circle cx="31" cy="38" r="3.6" fill="#101014"/>
        <circle cx="42" cy="38" r="3.6" fill="#101014"/>
        <circle cx="20" cy="49" r="3.6" fill="#101014"/>
        <circle cx="31" cy="49" r="3.6" fill="#101014"/>
      </svg>
      <h2 class="block__title">Выбирай удобное время:</h2>
    </div>
    <p class="block__text">
      3 сентября: 10:30 / 19:30 и<br>
      5 сентября 10:30 / 19:30.<br>
      <span>Время по Канкуну.</span>
    </p>
  </div>

  <div class="block block--last">
    <div class="split">
      <div>
        <div class="block__head">
          <!-- Ноутбук и телефон -->
          <svg class="block__icon" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="13" width="40" height="28" rx="5" fill="#e4fa7c" stroke="#101014" stroke-width="4"/>
            <path d="M1 47h44" stroke="#101014" stroke-width="4" stroke-linecap="round"/>
            <rect x="45" y="24" width="16" height="27" rx="5" fill="#ffffff" stroke="#101014" stroke-width="4"/>
            <path d="M50 45.5h6" stroke="#101014" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <h2 class="block__title">Для обучения<br>нужно:</h2>
        </div>
        <p class="block__text">Ноутбук,<br>Аккаунт Google</p>
      </div>

      <!-- Ноутбук с готовым сайтом: тот же макет, что и на странице -->
      <svg class="split__art" viewBox="0 0 380 290" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="34" y="10" width="312" height="216" rx="18" fill="#1b1b21"/>
        <rect x="50" y="26" width="280" height="184" rx="10" fill="#ffffff"/>
        <path d="M50 36a10 10 0 0 1 10-10h260a10 10 0 0 1 10 10v20H50z" fill="#f2f2f4"/>
        <circle cx="66" cy="42" r="4" fill="#d3d3dc"/>
        <circle cx="80" cy="42" r="4" fill="#d3d3dc"/>
        <circle cx="94" cy="42" r="4" fill="#d3d3dc"/>
        <rect x="66" y="72" width="96" height="10" rx="5" fill="#dcdce4"/>
        <rect x="66" y="94" width="248" height="46" rx="8" fill="#c8c8d4"/>
        <rect x="66" y="152" width="248" height="9" rx="4.5" fill="#dcdce4"/>
        <rect x="66" y="169" width="150" height="9" rx="4.5" fill="#dcdce4"/>
        <rect x="66" y="190" width="104" height="20" rx="10" fill="#cfef4e"/>
        <path d="M8 240h364l-16 28H24z" fill="#1b1b21"/>
        <rect x="152" y="246" width="76" height="8" rx="4" fill="#4a4a56"/>
      </svg>
    </div>
  </div>

</body>
</html>
